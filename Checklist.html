<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />
    <title>CaseyCZ</title>
    <meta name="description" content="Vítejte na mé osobní stránce, kde se můžete dozvědět více o mně, mých zájmech a projektech." />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="footer.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="icon" type="image/x-icon" href="icons/favicon.ico" />
    <!-- Ikony a manifesty ... -->
    <style>
      /* Základní styl pro stránku */
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        margin: 0;
        min-height: 100vh;
        color: #222;
        transition: background 0.3s, color 0.3s;
      }
      .night-mode {
        background-color: #181818 !important;
        color: #e0e0e0 !important;
      }
      .app-container {
        background: #fff;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 2px 16px rgba(0,0,0,0.12);
        max-width: 600px;
        margin: 32px auto;
        width: 100%;
        transition: background 0.3s, color 0.3s;
      }
      .night-mode .app-container {
        background: #232323;
        color: #e0e0e0;
      }
      .category {
        margin-bottom: 24px;
        border-bottom: 1px solid #e0e0e0;
        padding-bottom: 12px;
      }
      .night-mode .category {
        border-bottom: 1px solid #444;
      }
      .category-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        padding: 6px 0;
      }
      .category-header h2 {
        margin: 0;
        font-size: 1.2em;
        font-weight: 600;
      }
      .category-list {
        display: none;
        list-style-type: none;
        padding: 0;
        margin: 8px 0 0 0;
      }
      .category-list.open {
        display: block;
      }
      .category-list li {
        display: flex;
        align-items: center;
        margin-bottom: 6px;
        padding: 4px 0;
        border-radius: 4px;
        transition: background 0.2s;
      }
      .category-list li.completed span {
        text-decoration: line-through;
        color: #888;
      }
      .night-mode .category-list li.completed span {
        color: #666;
      }
      .delete-button {
        background: none;
        border: none;
        color: #d32f2f;
        cursor: pointer;
        font-size: 18px;
        margin-left: 8px;
        transition: transform 0.3s;
      }
      .delete-button:hover {
        transform: rotate(90deg) scale(1.2);
      }
      .add-item {
        margin-top: 10px;
        display: flex;
        gap: 6px;
      }
      .add-item input {
        flex: 1;
        padding: 6px;
        border-radius: 4px;
        border: 1px solid #bbb;
        background: #fafafa;
        color: #222;
      }
      .night-mode .add-item input {
        background: #222;
        color: #e0e0e0;
        border: 1px solid #444;
      }
      .add-item button {
        padding: 6px 12px;
        border-radius: 4px;
        border: none;
        background: #a124d0;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      .add-item button:hover {
        background: #7e1cae;
      }
      .language-switcher {
        display: flex;
        gap: 8px;
        margin: 16px 0;
        justify-content: center;
      }
      .language-switcher button {
        padding: 6px 14px;
        border-radius: 4px;
        border: none;
        background: #e0e0e0;
        color: #222;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
      }
      .language-switcher button.active,
      .language-switcher button:hover {
        background: #a124d0;
        color: #fff;
      }
      .night-mode .language-switcher button {
        background: #333;
        color: #e0e0e0;
      }
      .night-mode .language-switcher button.active,
      .night-mode .language-switcher button:hover {
        background: #a124d0;
        color: #fff;
      }
      #add-category {
        margin-top: 18px;
        display: flex;
        gap: 8px;
      }
      #add-category input {
        flex: 1;
        padding: 6px;
        border-radius: 4px;
        border: 1px solid #bbb;
        background: #fafafa;
        color: #222;
      }
      .night-mode #add-category input {
        background: #222;
        color: #e0e0e0;
        border: 1px solid #444;
      }
      #add-category button {
        padding: 6px 12px;
        border-radius: 4px;
        border: none;
        background: #a124d0;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      #add-category button:hover {
        background: #7e1cae;
      }
      /* Odkazy nahoře */
      .button-odkazy {
        display: flex;
        flex-wrap: nowrap; /* změna z wrap na nowrap */
        gap: 8px;
        justify-content: center;
        align-items: center;
        margin: 18px 0 0 0;
      }
      .btn.btn-primary {
        background: #a124d0;
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 7px 16px;
        font-weight: 600;
        text-decoration: none;
        transition: background 0.2s;
      }
      .btn.btn-primary:hover {
        background: #7e1cae;
      }
      .night-mode .btn.btn-primary {
        background: #7e1cae;
        color: #fff;
      }
      /* Logo a header */
      .header.text {
        background: #a124d0;
        color: #fff;
        padding: 18px 0;
        text-align: center;
        margin-bottom: 0;
      }
      .header.text .custom-logo {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        margin-bottom: 8px;
        border: 2px solid #fff;
      }
      .header.text h1,
      .header.text p {
        margin: 0;
        color: #fff;
      }
      .night-mode .header.text {
        background: #232323;
        color: #e0e0e0;
      }
      .footer {
        background: #a124d0;
        color: #fff;
        padding: 18px 0 8px 0;
        text-align: center;
        margin-top: 32px;
      }
      .night-mode .footer {
        background: #232323;
        color: #e0e0e0;
      }
      .social-items a {
        color: #fff;
        margin: 0 8px;
        font-size: 22px;
        transition: color 0.2s;
      }
      .social-items a:hover {
        color: #ffd700;
      }
      .list {
        list-style: none;
        padding: 0;
        margin: 12px 0 0 0;
        display: flex;
        justify-content: center;
        gap: 18px;
      }
      .list a {
        color: #fff;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.2s;
      }
      .list a:hover {
        color: #ffd700;
      }
      .night-mode #toggleDark {
        filter: invert(1) brightness(1.2);
      }
    </style>
  </head>
  <body>
    <div class="button-odkazy">
      <a href="/index.html" class="btn btn-primary">Domů</a>
      <a href="/webshare.html" class="btn btn-primary">Webshare</a>
      <a href="/livescore.html" class="btn btn-primary">Livescore</a>
      <a href="/Checklist.html" class="btn btn-primary">Checklist</a>
      <a href="/oldindex.html" class="btn btn-primary">Kontakt</a>
      <div style="text-align: center; margin-top: 0px">
        <div style="text-align: center; margin: 0">
          <a onclick="toggleNightMode();" role="button">
            <img
              width="24"
              height="24"
              src="./icons/DarkMode-Light.png"
              id="toggleDark"
              alt="Toggle Mode"
              style="display: inline-block"
            />
          </a>
        </div>
      </div>
    </div>
    <header class="header text">
      <div class="container">
        <img src="icons/logo.PNG" alt="Logo CaseyCZ" class="custom-logo" />
        <h1 class="text-white">Lukáš Kysela</h1>
        <p class="text-white">Vítejte na mé stránce</p>
      </div>
    </header>
    <div class="app-container">
      <h1 id="app-title">Seznam na Cesty</h1>
      <div class="trip-name">
        <input type="text" id="trip-name-input" placeholder="Název cesty" value="Portugalsko" style="width: 100%; padding: 10px;">
      </div>
      <div class="language-switcher">
        <button class="active" onclick="switchLanguage('cs')">Česky</button>
        <button onclick="switchLanguage('en')">English</button>
        <button onclick="switchLanguage('de')">Deutsch</button>
      </div>
      <div id="categories-container">
        <!-- Kategorie budou dynamicky přidávány pomocí JavaScriptu -->
      </div>
      <div id="add-category">
        <input type="text" id="new-category-name" placeholder="Název nové kategorie">
        <button onclick="addCategory()">Přidat kategorii</button>
      </div>
    </div>
    <script>
      const translations = {
            cs: {
                "app-title": "Seznam na Cesty",
                "trip-name-placeholder": "Název cesty",
                "new-item-placeholder": "Nová položka...",
                "add-button": "Přidat",
                "delete-button": "✖",
                "add-category-placeholder": "Název nové kategorie",
                "add-category-button": "Přidat kategorii",
                "categories": {
                    "essentials": "Základní Věci",
                    "clothing": "Oblečení",
                    "toiletries": "Toaletní Potřeby",
                    "gadgets": "Elektronika",
                    "health": "Zdraví a Léky",
                    "backpack": "Batoh",
                    "camping": "Kempování",
                    "swimming": "Plavání",
                    "food": "Jídlo",
                    "exercise": "Cvičení",
                    "work": "Práce",
                    "children": "Děti"
                },
                "items": {
                    "essentials": ["Pas", "Občanský průkaz", "Hotovost / Cizí měna", "Kreditní a debetní karty", "Peněženka", "Itinerář", "Kopie dokumentů / ID / Lístků", "Rezervace ubytování a kontaktní informace", "Opasek na peníze"],
                    "clothing": ["Trička", "Kalhoty", "Ponožky", "Spodní prádlo", "Bunda"],
                    "toiletries": ["Zubní kartáček", "Zubní pasta", "Floss", "Deodorant"],
                    "gadgets": ["Telefon", "Nabíječka", "Sluchátka", "Notebook", "Powerbanka"],
                    "health": ["Léky", "Náplasti", "Dezinfekční gel", "Očkovací průkaz"],
                    "backpack": ["Batoh", "Pláštěnka na batoh", "Organizéry"],
                    "camping": ["Stan", "Spacák", "Karimatka", "Vařič"],
                    "swimming": ["Plavky", "Ručník", "Opalovací krém"],
                    "food": ["Svačina", "Láhev na vodu", "Energetické tyčinky"],
                    "exercise": ["Sportovní oblečení", "Běžecké boty", "Fitness tracker"],
                    "work": ["Laptop", "Nabíječka na laptop", "Vizitky", "Poznámkový blok"],
                    "children": ["Plenky", "Vlhčené ubrousky", "Dětské oblečení", "Hračky"]
                }
            },
            en: {
                "app-title": "Packing List",
                "trip-name-placeholder": "Trip Name",
                "new-item-placeholder": "New item...",
                "add-button": "Add",
                "delete-button": "✖",
                "add-category-placeholder": "New category name",
                "add-category-button": "Add category",
                "categories": {
                    "essentials": "Essentials",
                    "clothing": "Clothing",
                    "toiletries": "Toiletries",
                    "gadgets": "Electronics",
                    "health": "Health and Medicine",
                    "backpack": "Backpack",
                    "camping": "Camping",
                    "swimming": "Swimming",
                    "food": "Food",
                    "exercise": "Exercise",
                    "work": "Work",
                    "children": "Children"
                },
                "items": {
                    "essentials": ["Passport", "ID card", "Cash / Foreign currency", "Credit and debit cards", "Wallet", "Itinerary", "Copies of documents / ID / Tickets", "Accommodation reservations and contact information", "Money belt"],
                    "clothing": ["T-shirts", "Pants", "Socks", "Underwear", "Jacket"],
                    "toiletries": ["Toothbrush", "Toothpaste", "Floss", "Deodorant"],
                    "gadgets": ["Phone", "Charger", "Headphones", "Laptop", "Power bank"],
                    "health": ["Medications", "Band-aids", "Hand sanitizer", "Vaccination card"],
                    "backpack": ["Backpack", "Rain cover for backpack", "Organizers"],
                    "camping": ["Tent", "Sleeping bag", "Sleeping pad", "Camping stove"],
                    "swimming": ["Swimwear", "Towel", "Sunscreen"],
                    "food": ["Snacks", "Water bottle", "Energy bars"],
                    "exercise": ["Workout clothes", "Running shoes", "Fitness tracker"],
                    "work": ["Laptop", "Laptop charger", "Business cards", "Notebook"],
                    "children": ["Diapers", "Wet wipes", "Children's clothes", "Toys"]
                }
            },
            de: {
                "app-title": "Packliste",
                "trip-name-placeholder": "Reisename",
                "new-item-placeholder": "Neuer Gegenstand...",
                "add-button": "Hinzufügen",
                "delete-button": "✖",
                "add-category-placeholder": "Neuer Kategoriename",
                "add-category-button": "Kategorie hinzufügen",
                "categories": {
                    "essentials": "Grundlagen",
                    "clothing": "Kleidung",
                    "toiletries": "Toilettenartikel",
                    "gadgets": "Elektronik",
                    "health": "Gesundheit und Medizin",
                    "backpack": "Rucksack",
                    "camping": "Camping",
                    "swimming": "Schwimmen",
                    "food": "Essen",
                    "exercise": "Sport",
                    "work": "Arbeit",
                    "children": "Kinder"
                },
                "items": {
                    "essentials": ["Reisepass", "Personalausweis", "Bargeld / Fremdwährung", "Kredit- und EC-Karten", "Geldbörse", "Reiseplan", "Kopien von Dokumenten / Ausweis / Tickets", "Unterkunftsreservierungen und Kontaktinformationen", "Geldgürtel"],
                    "clothing": ["T-Shirts", "Hosen", "Socken", "Unterwäsche", "Jacke"],
                    "toiletries": ["Zahnbürste", "Zahnpasta", "Zahnseide", "Deodorant"],
                    "gadgets": ["Handy", "Ladegerät", "Kopfhörer", "Laptop", "Powerbank"],
                    "health": ["Medikamente", "Pflaster", "Handdesinfektionsmittel", "Impfpass"],
                    "backpack": ["Rucksack", "Regenhülle für Rucksack", "Organizer"],
                    "camping": ["Zelt", "Schlafsack", "Isomatte", "Campingkocher"],
                    "swimming": ["Badekleidung", "Handtuch", "Sonnencreme"],
                    "food": ["Snacks", "Wasserflasche", "Energieriegel"],
                    "exercise": ["Sportkleidung", "Laufschuhe", "Fitness-Tracker"],
                    "work": ["Laptop", "Laptop-Ladegerät", "Visitenkarten", "Notizbuch"],
                    "children": ["Windeln", "Feuchttücher", "Kinderkleidung", "Spielzeug"]
                }
            }
        };

        let currentLanguage = 'cs';

        const initialCategories = [
            { id: 'essentials', name: 'Základní Věci', icon: '📌' },
            { id: 'clothing', name: 'Oblečení', icon: '👕' },
            { id: 'toiletries', name: 'Toaletní Potřeby', icon: '🧴' },
            { id: 'gadgets', name: 'Elektronika', icon: '📱' },
            { id: 'health', name: 'Zdraví a Léky', icon: '💊' },
            { id: 'backpack', name: 'Batoh', icon: '🎒' },
            { id: 'camping', name: 'Kempování', icon: '⛺' },
            { id: 'swimming', name: 'Plavání', icon: '🏊' },
            { id: 'food', name: 'Jídlo', icon: '🍎' },
            { id: 'exercise', name: 'Cvičení', icon: '🏋️' },
            { id: 'work', name: 'Práce', icon: '💼' },
            { id: 'children', name: 'Děti', icon: '👶' }
        ];

        let categories = initialCategories.map(category => ({
            ...category,
            items: translations.cs.items[category.id].map(item => ({ text: item, checked: false }))
        }));
        function renderCategories() {
            const container = document.getElementById('categories-container');
            container.innerHTML = '';

            categories.forEach(category => {
                const categoryElement = createCategoryElement(category);
                container.appendChild(categoryElement);
                // Po renderu vždy aktualizovat počet
                updateCategoryCount(category.id);
            });
        }

        function createCategoryElement(category) {
            const categoryDiv = document.createElement('div');
            categoryDiv.className = 'category';
            categoryDiv.id = category.id;

            const headerDiv = document.createElement('div');
            headerDiv.className = 'category-header';
            headerDiv.onclick = () => toggleCategory(category.id);

            // Záhlaví: ikona, název, počet splněných
            const heading = document.createElement('h2');
            heading.innerHTML = `${category.icon} ${category.name} <span class="category-count"></span>`;

            headerDiv.appendChild(heading);

            const list = document.createElement('ul');
            list.id = `${category.id}-list`;
            list.className = 'category-list';

            category.items.forEach(item => {
                const li = createListItem(item, category.id);
                list.appendChild(li);
            });

            const addItemDiv = document.createElement('div');
            addItemDiv.className = 'add-item';
            addItemDiv.innerHTML = `
                <input type="text" id="new-item-${category.id}" placeholder="${translations[currentLanguage]["new-item-placeholder"]}">
                <button onclick="addItem('${category.id}')">${translations[currentLanguage]["add-button"]}</button>
            `;

            categoryDiv.appendChild(headerDiv);
            categoryDiv.appendChild(list);
            categoryDiv.appendChild(addItemDiv);

            // Aktualizace počtu hned po vytvoření
            setTimeout(() => updateCategoryCount(category.id), 0);

            return categoryDiv;
        }

        function createListItem(item, categoryId) {
            const li = document.createElement('li');
            li.innerHTML = `
                <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleComplete(this, '${categoryId}')">
                <span>${item.text}</span>
                <button class="delete-button" onclick="deleteItem(this, '${categoryId}')">${translations[currentLanguage]["delete-button"]}</button>
            `;
            if (item.checked) {
                li.classList.add('completed');
            }
            return li;
        }

        function switchLanguage(language) {
            currentLanguage = language;
            document.querySelectorAll('.language-switcher button').forEach(button => {
                button.classList.remove('active');
            });
            document.querySelector(`.language-switcher button[onclick="switchLanguage('${language}')"]`).classList.add('active');

            document.getElementById('app-title').textContent = translations[language]["app-title"];
            document.getElementById('trip-name-input').placeholder = translations[language]["trip-name-placeholder"];
            document.getElementById('new-category-name').placeholder = translations[language]["add-category-placeholder"];
            document.querySelector('#add-category button').textContent = translations[language]["add-category-button"];

            categories.forEach(category => {
                category.name = translations[language].categories[category.id];
                category.items.forEach((item, index) => {
                    item.text = translations[language].items[category.id][index];
                });
            });

            renderCategories();
        }

        function toggleComplete(checkbox, categoryId) {
            const listItem = checkbox.parentElement;
            listItem.classList.toggle('completed');

            const category = categories.find(cat => cat.id === categoryId);
            const itemIndex = Array.from(listItem.parentElement.children).indexOf(listItem);
            category.items[itemIndex].checked = checkbox.checked;

            updateCategoryCount(categoryId);
        }

        function addItem(categoryId) {
            const inputId = `new-item-${categoryId}`;
            const input = document.getElementById(inputId);
            const itemText = input.value.trim();

            if (itemText !== '') {
                const category = categories.find(cat => cat.id === categoryId);
                category.items.push({ text: itemText, checked: false });

                const list = document.getElementById(`${categoryId}-list`);
                const listItem = createListItem({ text: itemText, checked: false }, categoryId);
                list.appendChild(listItem);

                input.value = '';
                updateCategoryCount(categoryId);
            }
        }

        function deleteItem(button, categoryId) {
            const listItem = button.parentElement;
            const list = listItem.parentElement;
            const itemIndex = Array.from(list.children).indexOf(listItem);

            const category = categories.find(cat => cat.id === categoryId);
            category.items.splice(itemIndex, 1);

            list.removeChild(listItem);
            updateCategoryCount(categoryId);
        }

        function toggleCategory(categoryId) {
            const list = document.getElementById(`${categoryId}-list`);
            list.classList.toggle('open');
        }

        function addCategory() {
            const input = document.getElementById('new-category-name');
            const categoryName = input.value.trim();

            if (categoryName !== '') {
                const categoryId = 'category-' + Date.now();
                const newCategory = {
                    id: categoryId,
                    name: categoryName,
                    icon: '📁',
                    items: []
                };

                categories.push(newCategory);
                const categoryElement = createCategoryElement(newCategory);
                document.getElementById('categories-container').appendChild(categoryElement);

                input.value = '';
            }
        }

        function updateCategoryCount(categoryId) {
            const category = categories.find(cat => cat.id === categoryId);
            const checkedItems = category.items.filter(item => item.checked).length;
            const totalItems = category.items.length;

            const countSpan = document.querySelector(`#${categoryId} .category-count`);
            countSpan.textContent = `(${checkedItems}/${totalItems})`;
        }

        // Initialize
        renderCategories();
    </script>

<script>
  let isNightMode = false;
  function toggleNightMode() {
    isNightMode = !isNightMode;
    document.body.classList.toggle("night-mode");
  }
</script>
