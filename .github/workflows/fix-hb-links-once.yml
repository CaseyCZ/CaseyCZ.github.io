name: Fix HB Control links once

on:
  push:
    branches:
      - Master
    paths:
      - ".github/workflows/fix-hb-links-once.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0

      - name: Update HB Control links on CaseyCZ web
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = "https://caseycz.github.io/HB-Control/"
          new = "https://130.61.49.108/hb-control/"

          for filename in ["README.md", "README_EN.md"]:
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected old HB Control URL not found in {filename}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          old_panel = '<a class="panel-link" href="#project-hb-control" data-cs="Zobrazit HB Control →" data-en="View HB Control →">Zobrazit HB Control →</a>'
          new_panel = '<a class="panel-link" href="https://130.61.49.108/hb-control/" target="_blank" rel="noopener" data-cs="Otevřít HB Control →" data-en="Open HB Control →">Otevřít HB Control →</a>'
          if old_panel not in text:
              raise SystemExit("Featured HB Control panel link not found")
          text = text.replace(old_panel, new_panel, 1)

          old_card = '<div class="tag-row"><span>iOS</span><span>iPadOS</span><span>SwiftUI</span><span>Homebridge</span><span data-cs="App Store připravujeme" data-en="App Store coming">App Store připravujeme</span></div></article>'
          new_card = '<div class="tag-row"><span>iOS</span><span>iPadOS</span><span>SwiftUI</span><span>Homebridge</span><span data-cs="App Store připravujeme" data-en="App Store coming">App Store připravujeme</span></div><div class="card-actions"><a class="text-link" href="https://130.61.49.108/hb-control/" target="_blank" rel="noopener" data-cs="Otevřít web →" data-en="Open website →">Otevřít web →</a><a class="text-link muted-link" href="https://github.com/CaseyCZ/HB-Control" target="_blank" rel="noopener">GitHub ↗</a></div></article>'
          if old_card not in text:
              raise SystemExit("HB Control project card not found")
          text = text.replace(old_card, new_card, 1)

          quick_links = '<div class="links-grid"><a class="link-card" href="https://github.com/CaseyCZ" target="_blank" rel="noopener">'
          replacement = '<div class="links-grid"><a class="link-card" href="https://130.61.49.108/hb-control/" target="_blank" rel="noopener"><div><strong>HB Control</strong><small data-cs="Web aplikace a podpora HB Control" data-en="HB Control website and support">Web aplikace a podpora HB Control</small></div><b>↗</b></a><a class="link-card" href="https://github.com/CaseyCZ" target="_blank" rel="noopener">'
          if quick_links not in text:
              raise SystemExit("Quick links grid not found")
          text = text.replace(quick_links, replacement, 1)

          path.write_text(text, encoding="utf-8")

          for filename in ["README.md", "README_EN.md"]:
              if "caseycz.github.io/HB-Control" in Path(filename).read_text(encoding="utf-8"):
                  raise SystemExit(f"Old HB Control URL remains in {filename}")
          PY

      - name: Commit migration and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-hb-links-once.yml
          git config user.name "CaseyCZ"
          git config user.email "caseycz@users.noreply.github.com"
          git add README.md README_EN.md index.html
          git commit -m "Point HB Control links to server web"
          git push origin HEAD:Master
