        color: #a124d0;
        text-decoration: none;

      }
      .social-items {
        margin-top: 12px;
      }
      .social-items a {
        color: #a124d0;
        margin: 0 10px;
        font-size: 2em;
        transition: color 0.2s;
      }
      .social-items a:hover {
