      <style>
          /* Původní CSS styly zůstávají nezměněny */

          .category-header {

              gap: 10px;
          }

              padding: 10px;

              border-radius: 4px;
          }

              font-size: 16px;
              background-color: #4CAF50;
              color: white;
              border: none;
              border-radius: 4px;
              cursor: pointer;
          }
  
          #add-category button:hover {

          }
      </style>

  <body>
      <div class="app-container">
          <h1 id="app-title">Seznam na Cesty</h1>
          <div class="trip-name">
              <input type="text" id="trip-name-input" placeholder="Název cesty" value="Portugalsko" style="width: 100%; padding: 10px;">
          </div>
  
          <div class="language-switcher">
              <button class="active" onclick="switchLanguage('cs')">Česky</button>
              <button onclick="switchLanguage('en')">English</button>
              <button onclick="switchLanguage('de')">Deutsch</button>
          </div>
  
          <div id="categories-container">
              <!-- Kategorie budou dynamicky přidávány pomocí JavaScriptu -->
          </div>
  
          <div id="add-category">
              <input type="text" id="new-category-name" placeholder="Název nové kategorie">
              <button onclick="addCategory()">Přidat kategorii</button>
          </div>
      </div>
  
      <script>
          const translations = {
              cs: {
                  "app-title": "Seznam na Cesty",
                  "trip-name-placeholder": "Název cesty",
                  "new-item-placeholder": "Nová položka...",
                  "add-button": "Přidat",
                  "delete-button": "Smazat",
                  "add-category-placeholder": "Název nové kategorie",
                  "add-category-button": "Přidat kategorii"
              },
              en: {
                  "app-title": "Packing List",
                  "trip-name-placeholder": "Trip Name",
                  "new-item-placeholder": "New item...",
                  "add-button": "Add",
                  "delete-button": "Delete",
                  "add-category-placeholder": "New category name",
                  "add-category-button": "Add category"
              },
              de: {
                  "app-title": "Packliste",
                  "trip-name-placeholder": "Reisenname",
                  "new-item-placeholder": "Neuer Gegenstand...",
                  "add-button": "Hinzufügen",
                  "delete-button": "Löschen",
                  "add-category-placeholder": "Neuer Kategoriename",
                  "add-category-button": "Kategorie hinzufügen"
              }
          };
  
          let currentLanguage = 'cs';
  
          const initialCategories = [
              {
                  id: 'essentials',
                  name: 'Základní Věci',
                  items: [
                      { text: 'Pas', checked: false },
                      { text: 'Občanský průkaz', checked: false },
                      { text: 'Hotovost / Cizí měna', checked: false },
                      { text: 'Kreditní a debetní karty', checked: false },
                      { text: 'Peněženka', checked: false },
                      { text: 'Itinerář', checked: false },
                      { text: 'Kopie dokumentů / ID / Lístků', checked: false },
                      { text: 'Rezervace ubytování a kontaktní informace', checked: false },
                      { text: 'Opasek na peníze', checked: false }
                  ]
              },
              {
                  id: 'clothing',
                  name: 'Oblečení',
                  items: [
                      { text: 'Trička', checked: false },
                      { text: 'Kalhoty', checked: false },
                      { text: 'Ponožky', checked: false },
                      { text: 'Spodní prádlo', checked: false },
                      { text: 'Bunda', checked: false }
                  ]
              },
              {
                  id: 'toiletries',
                  name: 'Toaletní Potřeby',
                  items: [
                      { text: 'Zubní kartáček', checked: false },
                      { text: 'Zubní pasta', checked: false },
                      { text: 'Floss', checked: false },
                      { text: 'Deodorant', checked: false }
                  ]
              },
              {
                  id: 'gadgets',
                  name: 'Elektronika',
                  items: [
                      { text: 'Telefon', checked: false },
                      { text: 'Nabíječka', checked: false },
                      { text: 'Sluchátka', checked: false },
                      { text: 'Notebook', checked: false },
                      { text: 'Powerbanka', checked: false }
                  ]
              },
              {
                  id: 'health',
                  name: 'Zdraví a Léky',
                  items: [
                      { text: 'Léky', checked: false },
                      { text: 'Náplasti', checked: false },
                      { text: 'Dezinfekční gel', checked: false },
                      { text: 'Očkovací průkaz', checked: false }
                  ]
              }
          ];
  
          let categories = [...initialCategories];
  
          function renderCategories() {
              const container = document.getElementById('categories-container');
              container.innerHTML = '';
  
              categories.forEach(category => {
                  const categoryElement = createCategoryElement(category);
                  container.appendChild(categoryElement);
              });
          }
  
          function createCategoryElement(category) {
              const categoryDiv = document.createElement('div');
              categoryDiv.className = 'category';
              categoryDiv.id = category.id;
  
              const headerDiv = document.createElement('div');
              headerDiv.className = 'category-header';
  
              const heading = document.createElement('h2');
              heading.onclick = () => toggleCategory(category.id);
              heading.innerHTML = `${category.name} <span class="category-count">(0/${category.items.length})</span> <span>+</span>`;
  
              const actionsDiv = document.createElement('div');
              actionsDiv.className = 'category-actions';
  
              const deleteButton = document.createElement('button');
              deleteButton.className = 'delete-category';
              deleteButton.textContent = translations[currentLanguage]["delete-button"];
              deleteButton.onclick = () => deleteCategory(category.id);
  
              actionsDiv.appendChild(deleteButton);
              headerDiv.appendChild(heading);
              headerDiv.appendChild(actionsDiv);
  
              const list = document.createElement('ul');
              list.id = `${category.id}-list`;
              list.className = 'open';
  
              category.items.forEach(item => {
                  const li = createListItem(item, category.id);
                  list.appendChild(li);
              });
  
              const addItemDiv = document.createElement('div');
              addItemDiv.className = 'add-item';
              addItemDiv.innerHTML = `
                  <input type="text" id="new-item-${category.id}" placeholder="${translations[currentLanguage]["new-item-placeholder"]}">
                  <button onclick="addItem('${category.id}')">${translations[currentLanguage]["add-button"]}</button>
              `;
  
              categoryDiv.appendChild(headerDiv);
              categoryDiv.appendChild(list);
              categoryDiv.appendChild(addItemDiv);
  
              return categoryDiv;
          }
  
          function createListItem(item, categoryId) {
              const li = document.createElement('li');
              li.innerHTML = `
                  <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleComplete(this, '${categoryId}')">
                  <span>${item.text}</span>
                  <button class="delete-item" onclick="deleteItem(this, '${categoryId}')">${translations[currentLanguage]["delete-button"]}</button>
              `;
              if (item.checked) {
                  li.classList.add('completed');
              }
              return li;
          }
  
          function switchLanguage(language) {
              currentLanguage = language;
              document.querySelectorAll('.language-switcher button').forEach(button => {
                  button.classList.remove('active');
              });
              document.querySelector(`.language-switcher button[onclick="switchLanguage('${language}')"]`).classList.add('active');
  
              const langData = translations[language];
  
              document.getElementById('app-title').textContent = langData["app-title"];
              document.getElementById('trip-name-input').placeholder = langData["trip-name-placeholder"];
              document.getElementById('new-category-name').placeholder = langData["add-category-placeholder"];
              document.querySelector('#add-category button').textContent = langData["add-category-button"];
  
              categories.forEach(category => {
                  const categoryElement = document.getElementById(category.id);
                  if (categoryElement) {
                      const addItemInput = categoryElement.querySelector('.add-item input');
                      const addItemButton = categoryElement.querySelector('.add-item button');
                      const deleteButton = categoryElement.querySelector('.delete-category');
  
                      addItemInput.placeholder = langData["new-item-placeholder"];
                      addItemButton.textContent = langData["add-button"];
                      deleteButton.textContent = langData["delete-button"];
  
                      const deleteItemButtons = categoryElement.querySelectorAll('.delete-item');
                      deleteItemButtons.forEach(button => {
                          button.textContent = langData["delete-button"];
                      });
                  }
              });
  
              updateCategoryCounts();
          }
  
          function toggleComplete(checkbox, categoryId) {
              const listItem = checkbox.parentElement;
              listItem.classList.toggle('completed');
  
              const category = categories.find(cat => cat.id === categoryId);
              const itemIndex = Array.from(listItem.parentElement.children).indexOf(listItem);
              category.items[itemIndex].checked = checkbox.checked;
  
              updateCategoryCount(categoryId);
              checkAllItemsPacked();
          }
  
          function addItem(categoryId) {
              const inputId = `new-item-${categoryId}`;
              const input = document.getElementById(inputId);
              const itemText = input.value.trim();
  
              if (itemText !== '') {
                  const category = categories.find(cat => cat.id === categoryId);
                  category.items.push({ text: itemText, checked: false });
  
                  const list = document.getElementById(`${categoryId}-list`);
                  const listItem = createListItem({ text: itemText, checked: false }, categoryId);
                  list.appendChild(listItem);
  
                  input.value = '';
                  updateCategoryCount(categoryId);
              }
          }
  
          function deleteItem(button, categoryId) {
              const listItem = button.parentElement;
              const list = listItem.parentElement;
              const itemIndex = Array.from(list.children).indexOf(listItem);
  
              const category = categories.find(cat => cat.id === categoryId);
              category.items.splice(itemIndex, 1);
  
              list.removeChild(listItem);
              updateCategoryCount(categoryId);
          }
  
          function toggleCategory(categoryId) {
              const list = document.getElementById(`${categoryId}-list`);
              const isOpen = list.classList.toggle('open');
              const categoryHeader = document.querySelector(`#${categoryId} h2`);
              const toggleSymbol = categoryHeader.querySelector('span:last-child');
  
              toggleSymbol.textContent = isOpen ? '-' : '+';
          }
  
          function addCategory() {
              const input = document.getElementById('new-category-name');
              const categoryName = input.value.trim();
  
              if (categoryName !== '') {
                  const categoryId = 'category-' + Date.now();
                  const newCategory = {
                      id: categoryId,
                      name: categoryName,
                      items: []
                  };
  
                  categories.push(newCategory);
                  const categoryElement = createCategoryElement(newCategory);
                  document.getElementById('categories-container').appendChild(categoryElement);
  
                  input.value = '';
              }
          }
  
          function deleteCategory(categoryId) {
              categories = categories.filter(category => category.id !== categoryId);
              const categoryElement = document.getElementById(categoryId);
              categoryElement.parentElement.removeChild(categoryElement);
          }
  
          function updateCategoryCount(categoryId) {
              const category = categories.find(cat => cat.id === categoryId);
              const checkedItems = category.items.filter(item => item.checked).length;
              const totalItems = category.items.length;
  
              const countSpan = document.querySelector(`#${categoryId} .category-count`);
              countSpan.textContent = `(${checkedItems}/${totalItems})`;
  
              checkAllItemsPacked();
          }
  
          function updateCategoryCounts() {
              categories.forEach(category => {
                  updateCategoryCount(category.id);
              });
          }
  
          function checkAllItemsPacked() {
              const allPacked = categories.every(category => 
                  category.items.length > 0 && category.items.every(item => item.checked)
              );
  
              document.querySelectorAll('.add-item').forEach(addItemDiv => {
                  addItemDiv.style.display = allPacked ? 'none' : 'block';
              });
          }
  
          // Initialize
          renderCategories();
          switchLanguage('cs');
      </script>
  </body>
